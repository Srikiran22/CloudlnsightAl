name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@39cd147401080927040e96a9a6574e8b04bc072a # v5.1.1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev libfreetype6-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Debug Python environment
        run: |
          python --version
          python -c "import sys; print(f'Python {sys.version}')"
          python -c "import platform; print(f'Platform: {platform.platform()}')"
          pip list

      - name: Static checks (serious errors only)
        run: |
          pip install ruff==0.16.4
          ruff check --select=E9,F63,F7,F82,F821 --preview .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Headless page boot check
        run: python bug_hunt.py

      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit --desc on || true
