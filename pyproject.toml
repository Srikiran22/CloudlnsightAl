[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tabulens"
version = "2.2.0"
description = "Interactive tabular data analysis workbench for exploratory data analysis, statistical drift detection, and leak-free machine learning pipelines."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Srikiran" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Security :: Security Evaluation",
]

[tool.setuptools.packages.find]
include = ["utils*", "pages*"]

[tool.setuptools]
py-modules = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear
    "UP",    # pyupgrade (Python 3.12 idioms)
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
]
ignore = [
    "E501",  # Line length handled by formatter / UI string length
    "B008",  # Do not perform function call in argument defaults (Streamlit idioms)
    "SIM117", # Streamlit container nesting requires sequential with blocks
    "B905",  # zip() strict= parameter
]

[tool.ruff.lint.isort]
known-first-party = ["utils", "pages"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.coverage.run]
source = ["utils", "pages", "app.py"]
omit = ["tests/*", "scratch/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

